<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Timothy Daly — Learning and Development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="190" rx="22"/></clipPath>
  </defs>
  <style>
    .name{font:800 46px Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#fff}
    .tag{font:700 22px Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#5eead4;opacity:0}
    .t1{animation:cycle 9s infinite 0s}
    .t2{animation:cycle 9s infinite 3s}
    .t3{animation:cycle 9s infinite 6s}
    @keyframes cycle{0%{opacity:0;transform:translateY(10px)}6%,28%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-10px)}}
    .bubble{animation:float 6s ease-in-out infinite}
    .bubble.b2{animation-delay:-2s}.bubble.b3{animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .bar{animation:grow 9s ease-in-out infinite;transform-origin:60px 150px}
    @keyframes grow{0%{transform:scaleX(0)}30%,100%{transform:scaleX(1)}}
  </style>
  <g clip-path="url(#round)">
    <rect width="900" height="190" fill="url(#bg)"/>
    <circle class="bubble" cx="790" cy="40" r="70" fill="#14b8a6" opacity=".12"/>
    <circle class="bubble b2" cx="860" cy="160" r="50" fill="#fbbf24" opacity=".14"/>
    <circle class="bubble b3" cx="700" cy="170" r="34" fill="#5eead4" opacity=".12"/>
    <text class="name" x="60" y="88">Timothy Francis Daly</text>
    <g transform="translate(0,0)">
      <text class="tag t1" x="60" y="128">Learning &amp; Development · Training &amp; Assessment</text>
      <text class="tag t2" x="60" y="128">I build the training resources I deliver.</text>
      <text class="tag t3" x="60" y="128">TAE40122 · Perth, Western Australia</text>
    </g>
    <rect class="bar" x="60" y="148" width="180" height="5" rx="2.5" fill="#14b8a6"/>
  </g>
</svg>
